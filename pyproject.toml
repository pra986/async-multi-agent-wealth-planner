[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "async-multi-agent-wealth-planner"
version = "0.1.0"
description = "Project 29: Asynchronous AWS SQS, Aurora PostgreSQL, and S3 Vectors multi-agent financial planner with job idempotency, per-specialist stage tracking, and 100% chart sum validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Pranil Deshmukh" }
]
dependencies = [
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.4.0",
]

[project.scripts]
wealth-planner-demo = "wealth_planner.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["wealth_planner*"]
